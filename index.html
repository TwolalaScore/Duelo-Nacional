<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Duelo Nacional de MCs · Estatísticas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0c0c0e; --panel:#16161a; --panel2:#1e1e24; --line:#2a2a32;
  --ink:#f2f2f4; --ink2:#b4b4bd; --muted:#7c7c88;
  --gold:#ffc83d; --gold-d:#3a2f12;
  --win:#4c8dff; --loss:#ff8a3d; --zero:#3a3a44;
  --alta:#ff5a5f; --media:#ffb020; --baixa:#7aa7ff; --info:#8a8a96;
  --r:10px;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 Inter,system-ui,sans-serif}
a{color:var(--gold);cursor:pointer;text-decoration:none}
a:hover{text-decoration:underline}
h1,h2,h3,.bebas{font-family:"Bebas Neue",Impact,sans-serif;letter-spacing:.5px;font-weight:400;margin:0}
h2{font-size:30px;margin:4px 0 14px}
h3{font-size:22px;margin:0 0 10px;color:var(--ink)}
header{position:sticky;top:0;z-index:20;background:rgba(12,12,14,.94);backdrop-filter:blur(6px);border-bottom:1px solid var(--line)}
.top{display:flex;align-items:center;gap:14px;padding:12px 20px 4px;max-width:1400px;margin:0 auto}
.logo{font-family:"Bebas Neue";font-size:30px;line-height:1}
.logo b{color:var(--gold);font-weight:400}
.logo small{display:block;font-family:Inter;font-size:11px;color:var(--muted);letter-spacing:1.5px;text-transform:uppercase}
nav{display:flex;gap:4px;overflow-x:auto;padding:6px 20px 0;max-width:1400px;margin:0 auto;scrollbar-width:none}
nav button{background:none;border:0;color:var(--ink2);font:600 13px Inter;padding:9px 12px;border-bottom:3px solid transparent;cursor:pointer;white-space:nowrap}
nav button:hover{color:var(--ink)}
nav button.on{color:var(--gold);border-color:var(--gold)}
nav button.admin{margin-left:auto;color:var(--muted)}
main{max-width:1400px;margin:0 auto;padding:22px 20px 60px}
.tab{display:none}.tab.on{display:block}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-bottom:16px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px}
.kpi .v{font-family:"Bebas Neue";font-size:34px;line-height:1}
.kpi .l{font-size:11px;text-transform:uppercase;letter-spacing:1px;color:var(--muted);margin-top:4px}
.kpi .s{font-size:12px;color:var(--ink2)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px;min-width:0}
.card+.card{margin-top:14px}
.grid>.card+.card{margin-top:0}
.muted{color:var(--muted)}.ink2{color:var(--ink2)}
.small{font-size:12px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.sp{flex:1}
select,input[type=search]{background:var(--panel2);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:8px 10px;font:inherit;min-width:180px}
label.f{display:flex;flex-direction:column;gap:4px;font-size:11px;text-transform:uppercase;letter-spacing:1px;color:var(--muted)}
.chip{display:inline-block;font:600 11px Inter;padding:2px 6px;border-radius:5px;background:var(--panel2);border:1px solid var(--line);color:var(--ink2);vertical-align:1px}
.chip.gold{background:var(--gold-d);border-color:#6b5520;color:var(--gold)}
.chip.win{color:var(--win);border-color:#29406b}
.chip.loss{color:var(--loss);border-color:#6b3d20}
.ufgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(54px,1fr));gap:6px;margin:10px 0 4px}
.ufgrid button{background:var(--panel2);border:1px solid var(--line);color:var(--ink);border-radius:8px;padding:7px 0;font:700 13px Inter;cursor:pointer}
.ufgrid button small{display:block;font:500 10px Inter;color:var(--muted)}
.ufgrid button.on{background:var(--gold);color:#111;border-color:var(--gold)}
.ufgrid button.on small{color:#3b2d00}
.ufgrid button:hover{border-color:var(--gold)}
table{width:100%;border-collapse:collapse}
th,td{padding:7px 8px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:11px;text-transform:uppercase;letter-spacing:.8px;color:var(--muted);font-weight:600;position:sticky;top:0;background:var(--panel)}
th.sort{cursor:pointer}th.sort:hover{color:var(--ink)}
th.c,td.c{text-align:center;font-variant-numeric:tabular-nums}
th.n,td.n{text-align:right;font-variant-numeric:tabular-nums}
tbody tr:hover td{background:#1b1b21}
.tw{overflow:auto;max-height:620px;border-radius:8px}
.mclist{display:flex;flex-wrap:wrap;gap:6px}
.mclist button{background:var(--panel2);border:1px solid var(--line);color:var(--ink);border-radius:20px;padding:6px 12px;font:600 12px Inter;cursor:pointer}
.mclist button.on{background:var(--gold);color:#111;border-color:var(--gold)}
.mclist button .c{color:var(--muted);font-weight:500;margin-left:4px}
.mclist button.on .c{color:#4a3a00}
/* bracket */
.bracket{display:flex;gap:14px;overflow-x:auto;padding-bottom:8px}
.col{min-width:230px;display:flex;flex-direction:column;gap:8px}
.col h4{margin:0 0 2px;font:600 11px Inter;text-transform:uppercase;letter-spacing:1px;color:var(--muted)}
.col .stack{display:flex;flex-direction:column;justify-content:space-around;gap:8px;flex:1}
.bt{background:var(--panel2);border:1px solid var(--line);border-radius:8px;overflow:hidden;font-size:13px}
.bt .p{display:flex;align-items:center;gap:6px;padding:5px 8px}
.bt .p+.p{border-top:1px solid var(--line)}
.bt .p .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bt .p .sc{font-family:"Bebas Neue";font-size:20px;line-height:1;width:16px;text-align:right}
.bt .p.w .nm{font-weight:700}.bt .p.w .sc{color:var(--gold)}
.bt .p.l{color:var(--ink2)}
.bt .tag{font-size:10px;color:var(--gold);padding:3px 8px;background:var(--gold-d);text-transform:uppercase;letter-spacing:.8px}
.champ{background:linear-gradient(135deg,#3a2f12,#1e1e24);border:1px solid #6b5520;border-radius:10px;padding:14px;text-align:center}
.champ .bebas{font-size:34px;color:var(--gold)}
/* matrix */
.mx{border-collapse:separate;border-spacing:2px}
.mx td,.mx th{padding:0;border:0;width:30px;height:28px;text-align:center;font-size:11px;font-variant-numeric:tabular-nums}
.mx th{background:none;position:static;color:var(--ink2);font-weight:700}
.mx td.c{border-radius:4px;cursor:pointer;color:#fff}
.mx td.c:hover{outline:2px solid var(--gold)}
.mx td.e{background:#141418}
.mx td.self{background:#000}
.legend{display:flex;gap:12px;align-items:center;font-size:12px;color:var(--ink2);flex-wrap:wrap}
.sw{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:-2px;margin-right:4px}
/* estaduais */
.est td{font-size:12px}
.est td.y{min-width:94px}
.est td .dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:4px;vertical-align:1px}
/* records */
.rec{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.rec .k{font-size:11px;text-transform:uppercase;letter-spacing:1px;color:var(--muted)}
.rec .rr{display:grid;grid-template-columns:26px minmax(0,1fr) 54px;align-items:center;gap:6px;padding:4px 0;font-size:12.5px;border-bottom:1px solid #222228}
.rec .rr:last-of-type{border-bottom:0}
.rec .rr .p{color:var(--muted);font-variant-numeric:tabular-nums;text-align:center}
.rec .rr .nm{display:flex;align-items:center;gap:4px;min-width:0;white-space:nowrap}
.rec .rr .nm > a:first-child{overflow:hidden;text-overflow:ellipsis}
.rec .rr .nm .chip{margin-left:auto;width:60px;flex:none;text-align:left;box-sizing:border-box}
.rec .rr .nm .chip + .chip{margin-left:4px}
.rec .rr .v{white-space:nowrap;text-align:center;font-variant-numeric:tabular-nums;color:var(--ink2)}
.rec .rr.top{padding:6px 0 8px;font-size:14px}
.rec .rr.top .p{color:var(--gold);font-family:"Bebas Neue";font-size:22px}
.rec .rr.top .nm.bebas{font-size:20px}
.rec .rr.top .nm.bebas .chip{font-family:Inter}
.rec .rr.top .v{font-family:"Bebas Neue";font-size:26px;color:var(--ink)}
.recs{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:12px}
.seg{display:inline-flex;background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:3px;gap:2px}
.seg button{background:none;border:0;color:var(--ink2);font:600 12px Inter;padding:6px 12px;border-radius:6px;cursor:pointer}
.seg button.on{background:var(--gold);color:#111}
.sev{display:inline-block;font:700 10px Inter;text-transform:uppercase;padding:2px 6px;border-radius:4px;color:#111}
.sev.alta{background:var(--alta)}.sev.média{background:var(--media)}.sev.baixa{background:var(--baixa)}.sev.info{background:var(--info)}
.adm td{white-space:normal}
.warn{border-left:3px solid var(--media);background:#2a2214;padding:8px 12px;border-radius:6px;font-size:13px;margin-bottom:12px}
.note{border-left:3px solid var(--baixa);background:#141c2a;padding:8px 12px;border-radius:6px;font-size:13px;color:var(--ink2)}
.empty{color:var(--muted);padding:20px;text-align:center}
.rl .ri{display:flex;align-items:center;gap:12px;padding:8px 2px;border-bottom:1px solid var(--line)}
.rl .ri:last-child{border-bottom:0}
.rl .rp{font-family:"Bebas Neue";font-size:22px;color:var(--muted);width:30px}
.rl .rp.g{color:var(--gold)}
.rl .rn{flex:1;font-weight:600;min-width:0}
.rl .rv{font-family:"Bebas Neue";font-size:30px;line-height:1;color:var(--ink);text-align:right}
.rl .rv small{font-family:Inter;font-size:11px;color:var(--muted);margin-left:5px;text-transform:uppercase;letter-spacing:.8px}
.vsx td{padding:8px 6px}
.vsx td.l{text-align:right;width:40%}
.vsx td.r{width:40%}
.vsx td.r .flag{margin:0 6px 0 5px}
.vsx td.sc{font-family:"Bebas Neue";font-size:26px;line-height:1;text-align:center;width:34px;color:var(--ink2)}
.vsx td.sc.w{color:var(--gold)}
.vsx td.x{text-align:center;color:var(--muted);width:14px}
.t26{display:inline-block;font:800 9px Inter;color:#04151a;background:#22d3ee;border-radius:4px;padding:1px 4px;margin-left:5px;vertical-align:2px;box-shadow:0 0 8px rgba(34,211,238,.75);letter-spacing:.3px}
.btn{background:var(--panel2);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:8px 14px;font:600 13px Inter;cursor:pointer}
.btn:hover{border-color:var(--gold)}.btn.gold{background:var(--gold);color:#111;border-color:var(--gold)}
.card.ed{border-color:#1f6f7d;background:linear-gradient(180deg,#10232a,var(--panel) 120px)}
.edf{margin-top:14px}.edf h4{margin:0 0 6px;font:700 12px Inter;text-transform:uppercase;letter-spacing:1px;color:var(--gold)}
.edr{display:flex;gap:8px;align-items:center;padding:4px 0;flex-wrap:wrap}.edr select{min-width:200px;padding:6px 8px}
.edr.bad select{border-color:var(--alta)}
.flag{width:18px;height:13px;object-fit:cover;border-radius:2px;vertical-align:-2px;margin-right:5px;box-shadow:0 0 0 1px rgba(255,255,255,.18)}
.mx th .flag{margin:0 0 2px}
.ufgrid button .flag{display:block;margin:0 auto 3px;width:22px;height:15px}
.tip{position:fixed;pointer-events:none;background:#000;border:1px solid var(--line);padding:6px 9px;border-radius:6px;font-size:12px;z-index:99;display:none;max-width:280px}
.res-Campeão{color:var(--gold);font-weight:700}.res-Vice{color:#e6e6e6;font-weight:600}
@media (max-width:900px){.g2,.g3{grid-template-columns:1fr}</style>
</head>
<body>
<header>
  <div class="top">
    <div class="logo">DUELO <b>NACIONAL</b> DE MCS<small>Estatísticas, chaveamentos e recordes</small></div>
  </div>
  <nav id="nav">
    <button data-t="inicio" class="on">Início</button>
    <button data-t="estados">Estados & MCs</button>
    <button data-t="geral">Geral dos estados</button>
    <button data-t="ranking">Ranking de MCs</button>
    <button data-t="edicoes">Edições</button>
    <button data-t="confrontos">Confrontos</button>
    <button data-t="estaduais">Estaduais</button>
    <button data-t="repescagem">Repescagem</button>
    <button data-t="recordes">Recordes</button>
    <button data-t="admin" class="admin">⚙ Admin</button>
  </nav>
</header>
<main>
  <section class="tab on" id="t-inicio"></section>
  <section class="tab" id="t-estados"></section>
  <section class="tab" id="t-geral"></section>
  <section class="tab" id="t-ranking"></section>
  <section class="tab" id="t-edicoes"></section>
  <section class="tab" id="t-confrontos"></section>
  <section class="tab" id="t-estaduais"></section>
  <section class="tab" id="t-repescagem"></section>
  <section class="tab" id="t-recordes"></section>
  <section class="tab" id="t-admin"></section>
</main>
<div class="tip" id="tip"></div>
<script src="data.js"></script>
<script>
"use strict";
const D = window.DUELO;
const $ = s => document.querySelector(s);
const MC = Object.fromEntries(D.mcs.map(m => [m.id, m]));
const UFS = Object.keys(D.ufs).sort();
const nm = id => MC[id] ? MC[id].nome : id;
const ufOf = id => MC[id] ? MC[id].uf : '?';
const pct = (a, b) => b ? (100 * a / b) : 0;
const f1 = x => x.toFixed(1).replace('.', ',') + '%';
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const mcLink = id => `<a onclick="goMC('${id.replace(/'/g,"\\'")}')">${esc(nm(id))}</a>${typeof IN_ATUAL !== 'undefined' && IN_ATUAL.has(id) ? `<span class="t26" data-tip="Disputa o Nacional ${EDY}">${String(EDY).slice(2)}</span>` : ''}`;
const FLAGF = {AC:'Bandeira do Acre.svg',AL:'Bandeira de Alagoas.svg',AP:'Bandeira do Amapá.svg',AM:'Bandeira do Amazonas.svg',BA:'Bandeira da Bahia.svg',CE:'Bandeira do Ceará.svg',DF:'Bandeira do Distrito Federal (Brasil).svg',ES:'Bandeira do Espírito Santo.svg',GO:'Flag of Goiás.svg',MA:'Bandeira do Maranhão.svg',MT:'Bandeira de Mato Grosso.svg',MS:'Bandeira de Mato Grosso do Sul.svg',MG:'Bandeira de Minas Gerais.svg',PA:'Bandeira do Pará.svg',PB:'Bandeira da Paraíba.svg',PR:'Bandeira do Paraná.svg',PE:'Bandeira de Pernambuco.svg',PI:'Bandeira do Piauí.svg',RJ:'Bandeira do estado do Rio de Janeiro.svg',RN:'Bandeira do Rio Grande do Norte.svg',RS:'Bandeira do Rio Grande do Sul.svg',RO:'Bandeira de Rondônia.svg',RR:'Bandeira de Roraima.svg',SC:'Bandeira de Santa Catarina.svg',SP:'Bandeira do estado de São Paulo.svg',SE:'Bandeira de Sergipe.svg',TO:'Bandeira do Tocantins.svg'};
const flag = uf => FLAGF[uf] ? `<img class="flag" src="https://commons.wikimedia.org/wiki/Special:FilePath/${encodeURIComponent(FLAGF[uf])}?width=60" alt="" loading="lazy" onerror="this.remove()">` : '';
const ufChip = uf => `<span class="chip">${flag(uf)}${uf}</span>`;
const mcFull = id => `${mcLink(id)} ${ufChip(ufOf(id))}`;
const labY = y => y === 2021 ? '2020/21' : String(y);
const vagaOf = (id, y) => (D.vagas[y] || {})[id];
const vagaChip = (id, y) => ({estadual: '<span class="chip win">Campeão estadual</span>', repescagem: '<span class="chip loss">Repescagem</span>', outra: '<span class="chip">Outra vaga</span>'})[vagaOf(id, y)] || '';

/* ---------- edição em andamento (resultados preenchidos no site) ---------- */
const ED = D.ed_atual || null, EDY = ED ? ED.ano : null;
const LS_KEY = 'duelo_edicao_' + EDY;
const EDS = {pub: null, loc: null};
if (ED) {
  try { const x = new XMLHttpRequest(); x.open('GET', 'edicao' + EDY + '.json?v=' + Date.now(), false); x.send(); if (x.status === 200) EDS.pub = JSON.parse(x.responseText); } catch (e) {}
  try { EDS.loc = JSON.parse(localStorage.getItem(LS_KEY) || 'null'); } catch (e) {}
  EDS.cur = EDS.loc || EDS.pub || {ano: EDY, jogos: {}};
  const okId = id => ED.participantes.includes(id);
  ED.fases.forEach(f => (EDS.cur.jogos[f] || []).forEach((j, i) => {
    if (!j || !okId(j.a) || !okId(j.b) || j.a === j.b || !/^[0-2]x[0-2]$/.test(j.r || '')) return;
    const [x, y] = j.r.split('x').map(Number); const winA = x > y;
    D.battles.push({ano: EDY, fase: f, ordem: i + 1, tipo: 'normal', a: winA ? j.a : j.b, b: winA ? j.b : j.a, sa: Math.max(x, y), sb: Math.min(x, y), id: D.battles.length, atual: true});
  }));
  D.vagas[EDY] = ED.vagas;
  if (!D.years.includes(EDY)) D.years.push(EDY);
  const fin = D.battles.find(b => b.ano === EDY && b.fase === 'Final');
  if (fin) D.champions[EDY] = {campeao: fin.a, vice: fin.b, placar: fin.sa + 'x' + fin.sb};
}
const IN_ATUAL = new Set(ED ? ED.participantes : []);

/* ---------- derivações ---------- */
const YEARS = D.years;
const YEARS_DONE = YEARS.filter(y => D.champions[y]);
const PHASES = {};               // ano -> [fases em ordem]
D.battles.forEach(b => { (PHASES[b.ano] = PHASES[b.ano] || []); if (!PHASES[b.ano].includes(b.fase)) PHASES[b.ano].push(b.fase); });
if (ED) PHASES[EDY] = ED.fases.slice();
const PARTY = {};                // ano -> Set de participantes
D.battles.forEach(b => (b.participantes || [b.a, b.b]).forEach(id => (PARTY[b.ano] = PARTY[b.ano] || new Set()).add(id)));
if (ED) ED.participantes.forEach(id => (PARTY[EDY] = PARTY[EDY] || new Set()).add(id));
const participates = (id, y) => !!(PARTY[y] && PARTY[y].has(id));
const yearsOf = id => YEARS.filter(y => participates(id, y));
// duelos par-a-par (triplo vira 3 pares)
const DUELS = [];
D.battles.forEach(b => {
  if (b.tipo === 'triplo') b.pares.forEach(([w, l, sw, sl]) => DUELS.push({b, w, l, sw, sl, triplo: true}));
  else DUELS.push({b, w: b.a, l: b.b, sw: b.sa, sl: b.sb});
});
// participações individuais
const PART = {};                 // mc -> [{b, won, rf, ra, opp:[...]}]
D.mcs.forEach(m => PART[m.id] = []);
D.battles.forEach(b => {
  if (b.tipo === 'triplo') {
    Object.entries(b.st).forEach(([id, [w, r, rv, td, tt]]) =>
      PART[id].push({b, won: !!w, rf: rv, ra: r - rv, td, tt, opp: b.participantes.filter(x => x !== id)}));
  } else {
    PART[b.a].push({b, won: true, rf: b.sa, ra: b.sb, opp: [b.b]});
    PART[b.b].push({b, won: false, rf: b.sb, ra: b.sa, opp: [b.a]});
  }
});
const bKey = b => b.ano * 1000 + PHASES[b.ano].indexOf(b.fase) * 100 + b.ordem;
Object.values(PART).forEach(l => l.sort((x, y) => bKey(x.b) - bKey(y.b)));
// campanha por ano
function campaign(id, y) {
  const l = PART[id].filter(p => p.b.ano === y);
  if (!l.length) return participates(id, y) ? {label: 'Aguardando', std: 'Aguardando', lvl: 98, w: 0, n: 0} : null;
  const last = l[l.length - 1], ph = PHASES[y];
  if (y === EDY && !D.champions[y] && last.won && last.b.fase !== 'Final') {
    const d = ph.indexOf(last.b.fase); return {label: 'Em disputa', std: 'Em disputa', lvl: ph.length - d - 1, w: l.filter(p => p.won).length, n: l.length};
  }
  let depth = ph.indexOf(last.b.fase), label;
  if (last.b.fase === 'Final') { label = last.won ? 'Campeão' : 'Vice'; depth += last.won ? 1 : 0; }
  else label = last.won ? last.b.fase : last.b.fase;
  const lvl = ph.length - depth; // 0 campeão, 1 vice/final, 2 semi...
  const std = lvl === 0 ? 'Campeão' : lvl === 1 ? 'Vice' : last.b.fase;
  return {label, lvl, std, w: l.filter(p => p.won).length, n: l.length};
}
function mcStats(id) {
  const l = PART[id];
  const s = {id, nome: nm(id), uf: ufOf(id), ed: yearsOf(id).length, bat: l.length, vit: l.filter(p => p.won).length,
    r: 0, rv: 0, td: 0, tt: 0, tit: 0, vice: 0, fin: 0, semi: 0, best: null};
  l.forEach(p => {
    s.r += p.rf + p.ra; s.rv += p.rf;
    if (p.b.tipo === 'triplo') { s.td += p.td; s.tt += p.tt; }
    else { if (p.rf === 2 && p.ra === 0) s.td++; if (p.ra === 2 && p.rf === 0) s.tt++; }
  });
  yearsOf(id).forEach(y => {
    const c = campaign(id, y);
    if (c.lvl === 0) s.tit++; if (c.lvl === 1) s.vice++; if (c.lvl <= 1) s.fin++; if (c.lvl <= 2) s.semi++;
    if (!s.best || c.lvl < s.best.lvl || (c.lvl === s.best.lvl && c.w > s.best.w)) s.best = {...c, ano: y};
  });
  s.der = s.bat - s.vit; s.ap = pct(s.vit, s.bat); s.apr = pct(s.rv, s.r); s.rp = s.r - s.rv;
  return s;
}
const MSTATS = Object.fromEntries(D.mcs.map(m => [m.id, mcStats(m.id)]));
const ACTIVE = D.mcs.filter(m => MSTATS[m.id].ed > 0).map(m => m.id);
function ufStats(uf) {
  const ids = ACTIVE.filter(id => ufOf(id) === uf);
  const s = {uf, nome: D.ufs[uf] || uf, mcs: ids.length, part: 0, bat: 0, vit: 0, r: 0, rv: 0, td: 0, tt: 0, tit: 0, vice: 0, fin: 0, semi: 0, ed: 0, best: null};
  ids.forEach(id => { const m = MSTATS[id]; ['bat','vit','r','rv','td','tt','tit','vice','fin','semi'].forEach(k => s[k] += m[k]); s.part += m.ed; });
  s.ed = YEARS.filter(y => ids.some(id => participates(id, y))).length;
  YEARS.forEach(y => ids.forEach(id => { const c = campaign(id, y); if (c && (!s.best || c.lvl < s.best.lvl || (c.lvl === s.best.lvl && c.w > s.best.w))) s.best = {...c, ano: y, id}; }));
  // batalhas internas (mesmo estado) contam 1 vitória e 1 derrota — mantemos
  s.der = s.bat - s.vit; s.ap = pct(s.vit, s.bat); s.apr = pct(s.rv, s.r);
  s.estTit = D.estaduais.filter(e => e.uf === uf).length;
  s.estDist = new Set(D.estaduais.filter(e => e.uf === uf).map(e => e.mc || e.nome.toUpperCase())).size;
  return s;
}

// tabela ordenável genérica
const TBL = {};
function sortTable(id, cols, rows, opts = {}) {
  const st = TBL[id] = TBL[id] || {k: opts.k || cols.find(c => c.n)?.k, d: -1};
  const c = cols.find(c => c.k === st.k);
  const val = r => c && c.v ? c.v(r) : r[st.k];
  const sorted = [...rows].sort((a, b) => { const x = val(a), y = val(b); return (typeof x === 'string' ? x.localeCompare(y) : x - y) * st.d || (b.bat || 0) - (a.bat || 0); });
  const al = c => c.n ? (opts.center && STATCOLS.includes(c) ? 'c' : 'n') : '';
  const head = cols.map(c => `<th class="sort ${al(c)}" onclick="resort('${id}','${c.k}')">${c.l}${st.k === c.k ? (st.d < 0 ? ' ▾' : ' ▴') : ''}</th>`).join('');
  const body = sorted.map((r, i) => `<tr>${cols.map(c => `<td class="${al(c)}">${c.f ? c.f(r, i) : esc(r[c.k])}</td>`).join('')}</tr>`).join('');
  TBL[id].render = () => { document.getElementById(id).innerHTML = sortTable(id, cols, rows, opts); };
  return `<div class="tw"><table><thead><tr>${head}</tr></thead><tbody>${body || `<tr><td colspan="${cols.length}" class="empty">Sem dados</td></tr>`}</tbody></table></div>`;
}
function resort(id, k) { const st = TBL[id]; st.d = st.k === k ? -st.d : -1; st.k = k; st.render(); }
const STATCOLS = [
  {k: 'ed', l: 'Edições', n: 1}, {k: 'tit', l: 'Títulos', n: 1}, {k: 'vice', l: 'Vices', n: 1}, {k: 'bat', l: 'Batalhas', n: 1},

function battleRow(p, me) {

}

/* ---------- EDIÇÕES ---------- */
let selYear = YEARS[YEARS.length - 1];
function goYear(y) { selYear = y; show('edicoes'); }
function btCard(b) {

    const order = [...b.classificados, b.eliminado];
    return `<div class="bt" data-tip="${esc(b.placar)}"><div class="tag">Double three · só o pior do round sai</div>
      ${order.map(id => { const ok = b.classificados.includes(id); return `<div class="p ${ok ? 'w' : 'l'}"><span class="nm">${mcLink(id)}</span>${ufChip(ufOf(id))}<span class="sc">${ok ? '✓' : '✕'}</span></div>`; }).join('')}</div>`;
  }
  const tw = b.sb === 0;
  return `<div class="bt">${tw ? '<div class="tag">twolala</div>' : ''}
    <div class="p w"><span class="nm">${mcLink(b.a)}</span>${ufChip(ufOf(b.a))}<span class="sc">${b.sa}</span></div>
    <div class="p l"><span class="nm">${mcLink(b.b)}</span>${ufChip(ufOf(b.b))}<span class="sc">${b.sb}</span></div></div>`;
}

      ${PHASES[y].map(f => `<div class="col"><h4>${f} · ${bs.filter(b => b.fase === f).length}</h4><div class="stack">${bs.filter(b => b.fase === f).map(btCard).join('')}</div></div>`).join('')}

/* ---------- EDITOR DA EDIÇÃO EM ANDAMENTO ---------- */
let EDW = null, edOpen = false;
function edWork() { if (!EDW) EDW = JSON.parse(JSON.stringify(EDS.cur || {ano: EDY, jogos: {}})); ED.fases.forEach((f, i) => { EDW.jogos[f] = EDW.jogos[f] || []; while (EDW.jogos[f].length < ED.jogos[i]) EDW.jogos[f].push({a: '', b: '', r: ''}); }); return EDW; }
const edCount = o => o ? ED.fases.reduce((a, f) => a + (o.jogos[f] || []).filter(j => j && j.a && j.b && j.r).length, 0) : 0;
function edWinners(fi) { const w = []; (edWork().jogos[ED.fases[fi]] || []).forEach(j => { if (j.a && j.b && j.r) { const [x, y] = j.r.split('x').map(Number); w.push(x > y ? j.a : j.b); } }); return w; }
function edSet(f, i, k, v) { edWork().jogos[f][i][k] = v; RENDER.edicoes(); }
function edOpts(fi, sel) {
  const pool = fi === 0 ? ED.participantes : edWinners(fi - 1);
  const ids = [...new Set([...pool, ...(sel ? [sel] : [])])].sort((a, b) => nm(a).localeCompare(nm(b)));
  return `<option value="">— escolher —</option>` + ids.map(id => `<option value="${id}" ${id === sel ? 'selected' : ''}>${esc(nm(id))} (${ufOf(id)})${ED.vagas[id] === 'repescagem' ? ' · rep.' : ''}</option>`).join('');
}
function editorHTML() {
  const W = edWork(), pubN = edCount(EDS.pub), locN = edCount(EDS.loc), wN = edCount(W);
  const sig = o => JSON.stringify(ED.fases.map(f => ((o && o.jogos[f]) || []).filter(j => j && (j.a || j.b || j.r)).map(j => [j.a, j.b, j.r])));
  const dirty = sig(W) !== sig(EDS.cur);
  const RES = ['2x0', '2x1', '1x2', '0x2'];
  const body = ED.fases.map((f, fi) => {
    const used = {}; W.jogos[f].forEach(j => [j.a, j.b].forEach(x => x && (used[x] = (used[x] || 0) + 1)));
    const pool = fi === 0 ? ED.participantes.length : edWinners(fi - 1).length;
    return `<div class="edf"><h4>${f} <span class="muted">· ${W.jogos[f].filter(j => j.a && j.b && j.r).length}/${ED.jogos[fi]} resultados</span></h4>
      ${fi > 0 && !pool ? '<p class="muted small">Lance resultados da fase anterior para liberar os vencedores aqui.</p>' : ''}
      ${W.jogos[f].map((j, i) => { const bad = (j.a && used[j.a] > 1) || (j.b && used[j.b] > 1) || (j.a && j.a === j.b);
        return `<div class="edr ${bad ? 'bad' : ''}"><span class="muted small" style="width:22px">${i + 1}</span>
        <select onchange="edSet('${f}',${i},'a',this.value)">${edOpts(fi, j.a)}</select>
        <div class="seg">${RES.map(r => `<button class="${j.r === r ? 'on' : ''}" onclick="edSet('${f}',${i},'r','${j.r === r ? '' : r}')">${r}</button>`).join('')}</div>
        <select onchange="edSet('${f}',${i},'b',this.value)">${edOpts(fi, j.b)}</select>
        ${bad ? '<span class="small" style="color:var(--alta)">MC repetido</span>' : ''}</div>`; }).join('')}</div>`; }).join('');
  return `<div class="card ed" style="margin-top:14px">
    <div class="row"><h3 style="margin:0">✏️ Lançar confrontos e resultados de ${EDY}</h3><div class="sp"></div>
      <button class="btn" onclick="edOpen=!edOpen;RENDER.edicoes()">${edOpen ? 'Fechar editor' : 'Abrir editor'}</button></div>
    <p class="small ink2" style="margin:8px 0 0">Publicado no site: <b>${pubN}</b> resultado(s) · ${EDS.loc ? `Salvo neste navegador: <b>${locN}</b>` : 'Nada salvo só neste navegador'}${dirty ? ' · <b style="color:var(--media)">alterações não salvas</b>' : ''}</p>
    ${edOpen ? `<div class="note" style="margin:12px 0">Escolha os dois MCs de cada confronto e clique no placar <b>do ponto de vista do MC da esquerda</b> (2x0, 2x1, 1x2 ou 0x2). Clicar de novo no placar apaga o resultado.
      <b>Salvar</b> grava neste navegador e já atualiza todas as estatísticas (estados, confrontos, rankings, recordes) para você conferir.
      Para todo mundo ver, clique em <b>Baixar arquivo para publicar</b> e suba o <code>edicao${EDY}.json</code> no GitHub.</div>
      <div class="row" style="margin-bottom:12px">
        <button class="btn gold" onclick="edSave()">💾 Salvar</button>
        <button class="btn" onclick="edDownload()">⬇ Baixar arquivo para publicar</button>
        ${EDS.loc ? '<button class="btn" onclick="edDiscard()">Descartar o que salvei neste navegador</button>' : ''}
      </div>${body}` : ''}
  </div>`;
}
function edClean(o) { const c = {ano: EDY, atualizado: new Date().toISOString(), jogos: {}}; ED.fases.forEach(f => c.jogos[f] = (o.jogos[f] || []).map(j => ({a: j.a || '', b: j.b || '', r: j.r || ''}))); return c; }
function edSave() { try { localStorage.setItem(LS_KEY, JSON.stringify(edClean(edWork()))); location.hash = 'edicoes-' + EDY + '-editor'; location.reload(); } catch (e) { alert('Não foi possível salvar neste navegador.'); } }
function edDiscard() { if (!confirm('Apagar o que foi salvo neste navegador e voltar para a versão publicada?')) return; localStorage.removeItem(LS_KEY); location.hash = 'edicoes-' + EDY + '-editor'; location.reload(); }
function edDownload() {
  const blob = new Blob([JSON.stringify(edClean(edWork()), null, 1)], {type: 'application/json'});
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'edicao' + EDY + '.json'; document.body.appendChild(a); a.click(); a.remove();
}

/* ---------- CONFRONTOS ---------- */
let vsA = 'BA', vsB = 'MG', mA = '', mB = '';
function goVS(a, b) { vsA = a; vsB = b; show('confrontos'); setTimeout(() => $('#vsbox').scrollIntoView({behavior: 'smooth'}), 50); }
function color(net, tot) {
  if (!tot) return '';
  const t = Math.min(1, Math.abs(net) / 4);
  if (net === 0) return 'background:#e3b505;color:#1a1400;font-weight:700';
  const [r, g, b] = net > 0 ? [22, 163, 74] : [220, 38, 38];
  return `background:rgba(${r},${g},${b},${0.45 + 0.55 * t})`;
}
RENDER.confrontos = () => {
  const ufs = UFS.filter(u => USTATS[u].bat);

  const pairs = []; ufs.forEach((a, i) => ufs.slice(i + 1).forEach(b => { const x = M[a][b]; if (x.v + x.d) pairs.push({a, b, ...x, t: x.v + x.d}); }));
  pairs.sort((p, q) => q.t - p.t);
  const intra = ufs.map(u => ({u, n: M[u][u].v})).filter(x => x.n).sort((a, b) => b.n - a.n);
  const list = DUELS.filter(d => { const a = ufOf(d.w), b = ufOf(d.l); return (a === vsA && b === vsB) || (a === vsB && b === vsA); }).sort((x, y) => bKey(x.b) - bKey(y.b));
  const wa = list.filter(d => ufOf(d.w) === vsA).length, wb = list.length - wa;
  const mcOpts = sel => ACTIVE.slice().sort((a, b) => nm(a).localeCompare(nm(b))).map(id => `<option value="${id}" ${id === sel ? 'selected' : ''}>${esc(nm(id))} (${ufOf(id)})</option>`).join('');
  const mlist = mA && mB ? DUELS.filter(d => (d.w === mA && d.l === mB) || (d.w === mB && d.l === mA)) : [];
  const duelRow = d => `<tr><td>${labY(d.b.ano)}</td><td>${d.b.fase}</td><td>${mcFull(d.w)}</td><td class="n">${d.triplo ? `<span class="chip" data-tip="${esc(d.b.placar)}">double three</span>` : d.sw + 'x' + d.sl}</td><td>${mcFull(d.l)}</td></tr>`;
  const DTH = `<thead><tr><th>Ano</th><th>Fase</th><th>Vencedor</th><th class="n">Placar</th><th>Perdedor</th></tr></thead>`;
  // revanches de MCs
  const mp = {}; DUELS.forEach(d => { const k = [d.w, d.l].sort().join('§'); (mp[k] = mp[k] || []).push(d); });
  const rev = Object.values(mp).filter(l => l.length > 1).sort((a, b) => b.length - a.length);
  $('#t-confrontos').innerHTML = `
  <h2>Confrontos entre estados</h2>
  <div class="card"><h3>Matriz de confrontos</h3>
    <p class="muted small">Linha = estado, coluna = adversário. O número é <b>vitórias–derrotas</b> da linha contra a coluna. Clique numa célula para ver as batalhas.</p>
    <div class="legend" style="margin-bottom:10px"><span><span class="sw" style="background:#16a34a"></span>linha venceu mais</span><span><span class="sw" style="background:#e3b505"></span>empate</span><span><span class="sw" style="background:#dc2626"></span>linha perdeu mais</span><span><span class="sw" style="background:#000;border:1px solid var(--line)"></span>mesmo estado</span></div>
    <div style="overflow:auto"><table class="mx"><thead><tr><th></th>${ufs.map(u => `<th>${flag(u)}<br>${u}</th>`).join('')}</tr></thead><tbody>
    ${ufs.map(a => `<tr><th style="text-align:left;white-space:nowrap;padding-right:4px">${flag(a)}${a}</th>${ufs.map(b => { const x = M[a][b], t = x.v + x.d;
      if (a === b) return `<td class="self ${t ? 'c' : ''}" ${t ? `onclick="goVS('${a}','${b}')" data-tip="${a}: ${x.v} batalha(s) entre MCs do próprio estado"` : ''}>${t ? x.v : ''}</td>`;
      return t ? `<td class="c" style="${color(x.v - x.d, t)}" onclick="goVS('${a}','${b}')" data-tip="<b>${a} × ${b}</b><br>${x.v} vitória(s), ${x.d} derrota(s)">${x.v}-${x.d}</td>` : '<td class="e"></td>'; }).join('')}</tr>`).join('')}
    </tbody></table></div>
  </div>
  <div class="card" id="vsbox"><h3>Estado × Estado</h3>

    <div class="kpis" style="margin-top:12px">${kpi(list.length, 'Batalhas')}${kpi(wa, 'Vitórias ' + vsA)}${kpi(wb, 'Vitórias ' + vsB)}</div>

    <div class="card"><h3>Batalhas entre MCs do mesmo estado</h3><table><tbody>${intra.map(x => `<tr><td><a onclick="goVS('${x.u}','${x.u}')">${flag(x.u)}${x.u}</a></td><td class="n">${x.n}</td></tr>`).join('') || '<tr><td class="empty">Nenhuma</td></tr>'}</tbody></table></div>

  $('#ma').onchange = e => { mA = e.target.value; RENDER.confrontos(); };
  $('#mb').onchange = e => { mB = e.target.value; RENDER.confrontos(); };

/* ---------- REPESCAGEM ---------- */
function groupStats(entries) { // entries: [{id, y}]
  const g = {part: entries.length, mcs: new Set(entries.map(e => e.id)).size, bat: 0, vit: 0, r: 0, rv: 0, td: 0, tt: 0, lv: [0, 0, 0, 0, 0, 0], tit: 0, fin: 0};
  entries.forEach(({id, y}) => {
    const l = PART[id].filter(p => p.b.ano === y);
    l.forEach(p => { g.bat++; g.vit += p.won; g.r += p.rf + p.ra; g.rv += p.rf; if (p.rf === 2 && p.ra === 0) g.td++; if (p.ra === 2 && p.rf === 0) g.tt++; });
    const c = campaign(id, y); if (c.lvl === 0) g.tit++; if (c.lvl <= 1) g.fin++;
    const ph = PHASES[y]; const reached = l.length + (c.lvl === 0 ? 1 : 0); // fases alcançadas
    for (let k = 0; k < reached && k < 6; k++) g.lv[k]++;
  });
  g.der = g.bat - g.vit; g.ap = pct(g.vit, g.bat); g.apr = pct(g.rv, g.r); g.vpp = g.part ? g.vit / g.part : 0;
  return g;
}

let recMode = 'nac';
function recCard(k, items, fmt = v => v, note = '') {
  if (!items.length) return '';
  let pos = 0, prev = null;
  const rows = items.slice(0, 6).map((it, i) => { if (it.v !== prev) { pos = i + 1; prev = it.v; } return {...it, pos}; });
  const [top, ...rest] = rows;
  return `<div class="rec"><div class="k">${k}</div>
  <div class="rr top"><span class="p">1º</span><span class="nm bebas">${top.h}</span><span class="v">${fmt(top.v)}</span></div>
  ${rest.map(i => `<div class="rr"><span class="p">${i.pos}º</span><span class="nm">${i.h}</span><span class="v">${fmt(i.v)}</span></div>`).join('')}
  ${note ? `<div class="muted small" style="margin-top:6px">${note}</div>` : ''}</div>`;
}
function rankBy(list, get, filt = () => true) { return list.filter(filt).map(x => ({...x, v: get(x)})).filter(x => x.v > 0).sort((a, b) => b.v - a.v); }

    <div class="card" style="margin-top:14px"><h3>Curiosidades</h3><ul class="ink2" style="margin:0;padding-left:18px;line-height:1.9">
      <li>Finais decididas em 2x1: <b>${finals.filter(f => f.sb === 1).length}</b> de ${finals.length}; em twolala: <b>${finals.filter(f => f.sb === 0).length}</b> (${finals.filter(f => f.sb === 0).map(f => labY(f.ano) + ' ' + esc(nm(f.a))).join(', ')}).</li>
      <li>Finais entre MCs do mesmo estado: ${ufFinalPair.length ? ufFinalPair.map(f => `${labY(f.ano)} (${ufOf(f.a)}: ${esc(nm(f.a))} × ${esc(nm(f.b))})`).join(', ') : 'nenhuma'}.</li>
      <li>Campeões que também eram o campeão estadual do ano: <b>${doubleCh.length}</b> de ${YEARS_DONE.length} (${doubleCh.map(e => labY(e.ano) + ' ' + esc(nm(e.mc))).join(', ')}).</li>
      <li>Campeões vindos da repescagem: ${YEARS_DONE.filter(y => vagaOf(D.champions[y].campeao, y) === 'repescagem').map(y => esc(nm(D.champions[y].campeao)) + ' (' + labY(y) + ')').join(', ') || 'nenhum'}.</li>
      <li>Bicampeões nacionais: ${M.filter(x => x.tit >= 2).map(x => x.h).join(', ') || 'nenhum'}.</li>
      <li>Estados com MC campeão nacional: <b>${U.filter(x => x.tit).length}</b> de ${UFS.length}.</li>
      <li>Double three (só o pior do round é eliminado): 2016 — TH e Nicolas Walter passaram, Vieira caiu; 2017 — Menor e Miliano passaram, Blackout caiu.</li>
    </ul></div>`;
  const est = `
    <h3>MCs</h3><div class="recs">
    ${recCard('Mais títulos estaduais', EC.map(x => ({...x, v: x.n})).sort((a, b) => b.v - a.v))}
    ${recCard('Maior sequência de títulos estaduais seguidos', EC.map(x => ({...x, v: consec(x)})).filter(x => x.v > 1).sort((a, b) => b.v - a.v))}
    ${recCard('Campeão estadual + campeão nacional no mesmo ano', doubleCh.map(e => ({h: `${mcLink(e.mc)} <span class="chip">${labY(e.ano)}</span>`, v: 1})), () => '🏆')}
    </div>
    <h3 style="margin-top:20px">Estados</h3><div class="recs">
    ${recCard('Mais estaduais registrados', UE.map(x => ({...x, v: x.n})).sort((a, b) => b.v - a.v))}
    ${recCard('Mais campeões estaduais diferentes', UE.map(x => ({...x, v: x.dist})).sort((a, b) => b.v - a.v))}
    ${recCard('Maior domínio de um único MC', UE.map(x => ({...x, v: x.dom})).filter(x => x.v).sort((a, b) => b.v - a.v), f1, '% dos estaduais do estado vencidos pelo maior campeão (mín. 4 estaduais)')}
    ${recCard('Menor domínio (mais rotatividade)', UE.filter(x => x.n >= 6).map(x => ({...x, v: x.dist / x.n * 100})).sort((a, b) => b.v - a.v), f1, 'Campeões diferentes ÷ estaduais (mín. 6)')}
    ${recCard('Campeões estaduais que chegaram à semifinal nacional', UE.map(x => ({...x, v: x.went})).sort((a, b) => b.v - a.v))}
    ${recCard('Campeões estaduais que ganharam o nacional', UE.map(x => ({...x, v: x.nac})).sort((a, b) => b.v - a.v))}
    </div>`;
  $('#t-recordes').innerHTML = `<div class="row"><h2 style="margin:0">Recordes</h2><div class="sp"></div><div class="seg"><button class="${recMode === 'nac' ? 'on' : ''}" onclick="recMode='nac';RENDER.recordes()">Duelo Nacional</button><button class="${recMode === 'est' ? 'on' : ''}" onclick="recMode='est';RENDER.recordes()">Estaduais</button></div></div>
  <div style="margin-top:14px">${recMode === 'nac' ? nac : est}</div>`;
};

/* ---------- ADMIN ---------- */
let admSev = '', admCat = '';
RENDER.admin = () => {
  const I = D.inconsist;
  const sevs = ['alta', 'média', 'baixa', 'info'], cats = [...new Set(I.map(i => i.cat))];
  const rows = I.filter(i => (!admSev || i.sev === admSev) && (!admCat || i.cat === admCat));
  $('#t-admin').innerHTML = `<h2>Admin · Inconsistências</h2>
  <div class="note" style="margin-bottom:14px">Verificações automáticas cruzando a planilha de estatísticas, os chaveamentos e os campeões estaduais. <b>Alta</b> = provável erro de dado; <b>média</b> = número que não fecha; <b>baixa</b> = grafia/digitação; <b>info</b> = pode estar certo, mas vale conferir.</div>
  <div class="kpis">${sevs.map(s => kpi(I.filter(i => i.sev === s).length, `<span class="sev ${s}">${s}</span>`)).join('')}</div>
  <div class="card"><div class="row" style="margin-bottom:10px">
    <div class="seg"><button class="${!admSev ? 'on' : ''}" onclick="admSev='';RENDER.admin()">Todas</button>${sevs.map(s => `<button class="${admSev === s ? 'on' : ''}" onclick="admSev='${s}';RENDER.admin()">${s}</button>`).join('')}</div>
    <select onchange="admCat=this.value;RENDER.admin()"><option value="">Todas as categorias</option>${cats.map(c => `<option ${c === admCat ? 'selected' : ''}>${c}</option>`).join('')}</select>
    <div class="sp"></div><span class="muted small">${rows.length} itens</span></div>
    <div class="tw"><table class="adm"><thead><tr><th>Nível</th><th>Categoria</th><th>Ano</th><th>Descrição</th></tr></thead><tbody>
    ${rows.map(i => `<tr><td><span class="sev ${i.sev}">${i.sev}</span></td><td>${esc(i.cat)}</td><td>${i.ano ? (i.ano === 2021 ? '2020/21' : i.ano) : '—'}</td><td>${esc(i.msg)}</td></tr>`).join('')}
    </tbody></table></div></div>
  ${rows.length ? '' : '<div class="card empty">✔ Nenhuma inconsistência pendente neste filtro.</div>'}
  <div class="card"><h3>Correções já aplicadas (19/11/2026)</h3><ul class="ink2" style="margin:0;padding-left:18px;line-height:1.8">
    <li>Estaduais: KDS incluído como campeão de Roraima em 2017 (não disputou o nacional por motivos pessoais).</li>
    <li>2012 (quartas): adversários corrigidos — Mirapotira 2x1 Buddy Poke e Tagarela 2x1 Set.</li>
    <li>Onze (AL): rounds 4 → 5, como no chaveamento. Snart (CE): rounds vencidos 3 → 2.</li>
    <li>Incluído o double three de 2016 (fase preliminar): TH × Nicolas Walter × Vieira — Vieira eliminado no 1º round. Estatísticas de TH e Nicolas Walter ajustadas (+1 batalha, +1 vitória e +1 round vencido cada).</li>
    <li>Nomes padronizados: Tagrela → Tagarela, Koel → Koell, Martizin → Martzin, Vincius ZN → Vinicius ZN, Tonhao → Tonhão, "Torris RN)" → "Torris (RN)", Biro Brio → Biro Biro, Kadosh → Kadoshi, Aleson → Alesson; espaços extras removidos (ES, CH, Will, Miliano).</li>
    <li>Nomes oficiais seguindo os estaduais (mesma pessoa nas três planilhas): Jeff → Jeffe (MA), Dre → Drê Araujo (SC), Felinho → Felinho Nordestino (PI), JP → JP da Norte (DF), Big Leo → Big Léo (MG).</li>
    <li>Confirmado: existem dois MCs chamados NG (MG e SE), Vitu (PE e SC) e Jeffe (MA e DF) — tratados como MCs diferentes.</li>
    <li>Confirmado: em 2018 e 2019 vários campeões estaduais não foram ao nacional; desde 2020/21 as vagas restantes da chave de 32 são de repescagem (aba Repescagem).</li>
  </ul></div>
  <div class="card"><h3>Como os dados foram interpretados</h3><ul class="ink2" style="margin:0;padding-left:18px;line-height:1.8">
    <li>As estatísticas do site são <b>recalculadas a partir dos chaveamentos</b>. Quando a planilha de estatísticas tem outro número, ele aparece aqui como "Estatística".</li>
    <li>O estado de cada MC vem da planilha de estatísticas (coluna ESTADO). Nos anos sem sigla no chaveamento, o MC é ligado pelo nome.</li>
    <li>Twolala = vitória por 2x0. Uma batalha 2x1 soma 3 rounds disputados.</li>
    <li>Double three conta como 1 batalha para cada um dos 3: os 2 classificados ganham, o eliminado perde.</li>
    <li>2016 (fase preliminar): TH × Nicolas Walter × Vieira — Vieira caiu no 1º round. Rounds: TH 1/1, Nicolas Walter 1/1, Vieira 0/1.</li>
    <li>2017 (1ª fase): Menor × Miliano × Blackout — Menor 1x0 nos dois, depois Miliano 2x0 Blackout. Rounds: Menor 1/1, Miliano 2/3 (twolala sobre Blackout), Blackout 0/3.</li>
    <li>Nos confrontos entre estados, o double three entra como duelos: 2016 TH (SP) e Nicolas Walter (RS) venceram Vieira (AC); 2017 Menor (AM) venceu Miliano (MS) e Blackout (PA), e Miliano (MS) venceu Blackout (PA).</li>
    <li>2020/2021 aparece como uma única edição (2020/21).</li>
    <li>Edição 2026 em andamento: participam os 27 campeões estaduais de 2026 + 5 repescados (Jaya Luuck, Havel, Rico Mesquita, Martin e Vitu). Eles já contam como edição disputada e aparecem com a marca <span class="t26">26</span>. Os resultados lançados no editor da aba Edições entram em todas as estatísticas.</li>
    <li>Em 2012–2016 a primeira rodada (8 MCs) foi tratada como Quartas de final.</li>
    <li>Campeões estaduais de 2026 já estão na planilha, mas ainda não há chaveamento nacional de 2026.</li>
  </ul></div>`;
};

(() => { const h = location.hash.replace('#', '').split('-');
  if (h[0] === 'edicoes' && +h[1]) { selYear = +h[1]; if (h[2] === 'editor') edOpen = true; history.replaceState(null, '', location.pathname); show('edicoes'); }
  else RENDER.inicio(); })();
</script>
